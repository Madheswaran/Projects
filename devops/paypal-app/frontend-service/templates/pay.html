<!DOCTYPE html>

<html>

<head>

    <title>Pay Now</title>

    <link rel="stylesheet"
          href="/static/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="topbar">

    <div class="logo">
        {{ APP_NAME }}
    </div>

    <a href="/logout"
       class="logout-btn">
        Logout
    </a>

</div>

<div class="container">

    <div class="payment-card">

        <h2>Send Payment</h2>

        <form method="POST">

            <div class="form-row">

                <label for="receiver">
                    Receiver Email
                </label>

                <input
                    type="email"
                    id="receiver"
                    name="receiver"
                    placeholder="receiver@gmail.com"
                    required>

            </div>

            <div class="form-row">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="1"
                    placeholder="Enter Amount"
                    required>

            </div>

            <div class="form-actions">

                <button
                    class="action-btn"
                    type="submit"
                    onclick="this.disabled=true;this.form.submit();">

                    Pay Now

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
