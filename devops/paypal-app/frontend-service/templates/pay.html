<!DOCTYPE html>

<html>

<head>

    <title>Pay Now</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="topbar">

    <div class="logo">
        {{ APP_NAME }}
    </div>

    <a href="/logout"
       class="logout-btn">

       Logout

    </a>

</div>

<div class="container">

<div class="card" style="width:600px;margin:auto;">

<h2>Send Payment</h2>

<form method="POST">

<label>Receiver Email</label>

<input
type="email"
name="receiver"
placeholder="receiver@gmail.com"
required>

<br><br>

<label>Amount</label>

<input
type="number"
step="0.01"
name="amount"
required>

<br><br>

<button
class="action-btn"
type="submit">

Pay Now

</button>

</form>

</div>

</div>

</body>

</html>
