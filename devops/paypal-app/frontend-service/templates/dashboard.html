<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>PayPal Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <div class="logo">
        PayPal
    </div>

    <div class="nav-right">

        <button class="icon-btn">
            🔔 Notifications
        </button>

        <a href="/logout" class="logout-btn">
            Logout
        </a>

    </div>

</div>


<div class="container">


    <div class="dashboard-grid">


        <div class="profile-card">

            <h2>
                Welcome {{ customer.name }}
            </h2>

            <hr>

            <p>

                <strong>Email</strong><br>

                {{ customer.email }}

            </p>

            <p>

                <strong>Wallet Balance</strong><br>

                ₹5,000

            </p>

            <p>

                <strong>Last Login</strong><br>

                Today 10:30 AM

            </p>

            <p>

                <strong>Status</strong><br>

                Active

            </p>

        </div>



        <div class="action-card">

            <h2>

                Quick Actions

            </h2>

            <hr>

            <a href="/pay" class="action-btn">
                💳 Pay Now
            </a>

            <button class="action-btn">
                💰 Add Money
            </button>

            <button class="action-btn">
                📜 Transaction History
            </button>

        </div>

    </div>



    <div class="transactions">

        <h2>

            Recent Transactions

        </h2>

        <table>

            <tr>

                <th>Merchant</th>

                <th>Amount</th>

                <th>Status</th>

            </tr>

            <tr>

                <td>Amazon</td>

                <td>-₹500</td>

                <td class="success">
                    Success
                </td>

            </tr>

            <tr>

                <td>Swiggy</td>

                <td>-₹220</td>

                <td class="success">
                    Success
                </td>

            </tr>

            <tr>

                <td>Salary</td>

                <td class="credit">
                    +₹65,000
                </td>

                <td class="credit">
                    Credit
                </td>

            </tr>

            <tr>

                <td>Electricity</td>

                <td>-₹1,800</td>

                <td class="success">
                    Success
                </td>

            </tr>

        </table>

    </div>


</div>

</body>

</html>
