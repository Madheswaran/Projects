apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb

data:

  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS customers (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      email VARCHAR(100) UNIQUE NOT NULL,
      password VARCHAR(100) NOT NULL,
      wallet DECIMAL(10,2) DEFAULT 0
    );

  02-seed.sql: |
    INSERT INTO customers (name,email,password,wallet)
    VALUES
    ('Ganesha','ganesha@gmail.com','password123',5000),
    ('Muruga','muruga@gmail.com','password123',3000),
    ('Lakshmi','lakshmi@gmail.com','password123',7000);